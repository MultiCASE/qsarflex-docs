services:

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: qsarflex_screenshots
      POSTGRES_USER: screenshots
      POSTGRES_PASSWORD: screenshots
    ports:
      - "5433:5432"
    volumes:
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/01_seed.sql
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screenshots -d qsarflex_screenshots"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  user-manager-be:
    build:
      context: ../../RiderProjects/multicase-user-manager-be
      dockerfile: multicase-user-manager-be/Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      JWT_ISSUER: https://cognito-idp.us-east-2.amazonaws.com/us-east-2_051nTaxcm
      FE_URL: http://localhost:3000
      APP_NAME: QSARFlex
      AWS_ACCESS_KEY_ID: AKIATPEG34XFOFGWTJUJ
      AWS_SECRET_ACCESS_KEY: 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
      USERDATA_CLOUDFRONT_DOMAIN: d2as2iq2casmwr.cloudfront.net
      USERDATA_CLOUDFRONT_KEY_ID: K11FC8XI8JICEG
      USERDATA_BUCKET_NAME: multicase-users-data
      USERPOOL_ID: us-east-2_051nTaxcm
      AWS_REGION: us-east-2
      PRIVATE_KEY: 
      ConnectionStrings__DefaultConnection: Host=postgres;Database=qsarflex_screenshots;Username=screenshots;Password=screenshots;Port=5432
      COGNITO_CLIENT_ID: 5tiu1mohjpm4j63kopba59gqf5
      COGNITO_CLIENT_SECRET: 1phqlokgk7j9cahogm8fo3ttajaleu2oe1sk80n7dkdql81hie5u
      REDIS_CONNECTION_STRING: redis:6379
      MULTICASE_BACKEND_API_KEY: qsarflex-screenshots-api-key-2026

  qsarflex-be:
